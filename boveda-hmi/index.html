<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bóveda de Seguridad - Control de Acceso HMI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 5px; font-size: 24px; letter-spacing: 1px; }
    #status-box {
      margin: 10px 0;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
      background-color: #333;
      min-width: 580px;
      text-align: center;
      transition: background-color 0.2s ease;
    }
    .video-container {
      position: relative;
      width: 640px;
      height: 480px;
      border: 3px solid #444;
      border-radius: 8px;
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    button {
      padding: 10px 18px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #007acc;
      color: white;
      transition: background-color 0.2s ease;
    }
    button:hover:not(:disabled) { background-color: #005999; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    /* Ocultos visualmente sin romper referencias en app.js */
    #btnConectarSerial, #btnSimularHuella { display: none; }
    #btnReiniciarSistema { background-color: #c53030; }
    #btnReiniciarSistema:hover { background-color: #9b2c2c; }
  </style>
  <!-- Importar face-api.js local -->
  <script defer src="face-api.min.js"></script>
  <script defer src="app.js?v=4"></script>
</head>
<body>

  <h1 id="titulo-fase">CONTROL DE ACCESO BIOMÉTRICO</h1>
  <div id="status-box">Iniciando sistema... Cargando modelos...</div>

  <div class="video-container">
    <video id="videoInput" autoplay muted playsinline></video>
    <canvas id="overlayCanvas"></canvas>
  </div>

  <div class="controls">
    <button id="btnConectarSerial">Conectar Puerto Serial (USB)</button>
    <button id="btnSimularHuella" disabled>Simular Huella OK ('H')</button>
    <button id="btnReiniciarSistema">Reiniciar Sistema</button>
  </div>

</body>
</html>
